  <script>
    // Тема и режим до первой отрисовки: без белой вспышки на экране PIN
    (function () { var r = document.documentElement; try {
      var L = JSON.parse(localStorage.getItem('hub.look') || 'null') || {};
      var t = L.theme || JSON.parse(localStorage.getItem('hub.theme') || 'null');
      r.setAttribute('data-theme', 'mosaic');
      var m = JSON.parse(localStorage.getItem('hub.bootMode') || 'null');
      if (m) { r.setAttribute('data-mode', m); r.style.colorScheme = m; }
      var bg = JSON.parse(localStorage.getItem('hub.bootBg') || 'null');
      if (bg) { r.style.background = bg; var mt = document.querySelector('meta[name="theme-color"]'); if (mt) mt.setAttribute('content', bg); }
    } catch (e) { r.setAttribute('data-theme', 'mosaic'); } })();
  </script>
  <style>
    /* Первый кадр: фон и экран PIN рисуются сразу, до загрузки основных стилей (без белой вспышки) */
    html { background: #0b0b0d; color: #ececef; }
    @media (prefers-color-scheme: light) { html:not([data-mode="dark"]) { background: #eceded; color: #16161a; } }
    html[data-mode="light"] { background: #eceded; color: #16161a; }
    body { margin: 0; background: inherit; }
  </style>

<body>
  <div class="lock" id="lock" role="dialog" aria-modal="true" aria-labelledby="lock-title">
    <div class="lock__box">
      <h1 id="lock-title">Хаб</h1>
      <p class="muted" id="lock-hint"></p>
      <form id="lock-form" class="stack" autocomplete="off">
        <div id="lock-code-wrap" class="stack" hidden>
          <label class="sr-only" for="lock-code">Код восстановления</label>
          <input class="field mono" id="lock-code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Код восстановления">
        </div>
        <label class="sr-only" for="lock-pin">PIN</label>
        <input class="field lock__pin" id="lock-pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="PIN">
        <label class="sr-only" for="lock-pin2" id="lock-pin2-label" hidden>Повтори PIN</label>
        <input class="field lock__pin" id="lock-pin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" placeholder="Повтори" hidden>
        <p class="lock__err" id="lock-err" role="alert"></p>
        <button class="btn btn--primary" id="lock-submit" type="submit">Открыть</button>
      </form>
      <div class="stack" id="lock-recovery" hidden>
        <p class="lock__code mono" id="lock-recovery-code"></p>
        <button class="btn" id="lock-recovery-copy" type="button">Скопировать код</button>
        <button class="btn btn--primary" id="lock-recovery-done" type="button">Я сохранил код, продолжить</button>
      </div>
      <button class="lock__link" id="lock-restore" type="button" hidden>У меня уже есть код восстановления</button>
      <button class="lock__link" id="lock-forgot" type="button">Забыл PIN</button>
      <div class="card stack" id="lock-reset" hidden>
        <p>Сброс удалит PIN, токен и неотправленные записи на этом устройстве. Данные в репозитории не тронутся: доступ к ним вернётся по коду восстановления.</p>
        <div class="row">
          <button class="btn" id="lock-reset-no" type="button">Отмена</button>
          <button class="btn btn--primary" id="lock-reset-yes" type="button">Сбросить</button>
        </div>
      </div>
    </div>
  </div>

  <div class="app" id="app" hidden>
    <header class="topbar">
      <h1 class="topbar__title" id="topbar-title">Хаб</h1>
      <div class="topbar__right">
        <button class="iconbtn" id="search-btn" type="button" aria-label="Поиск по хабу"></button>
        <button class="sync-chip" type="button" data-sync aria-live="polite"></button>
        <a class="iconbtn" id="gear" href="#/settings" aria-label="Настройки"></a>
      </div>
    </header>
    <nav class="nav" id="nav" aria-label="Основная навигация"></nav>
    <main class="main" id="main" tabindex="-1"></main>
  </div>

  <button class="fab" id="fab" type="button" aria-label="Добавить запись"></button>

  <dialog class="sheet" id="plus" aria-labelledby="plus-title">
    <div class="sheet__head">
      <h2 id="plus-title">Новая запись</h2>
      <button class="iconbtn" id="plus-close" type="button" data-close aria-label="Закрыть"></button>
    </div>
    <div class="chips" role="group" aria-label="Тип записи"></div>
    <form class="sheet__form">
      <label class="sr-only" for="plus-text">Одна строка</label>
      <input class="field" id="plus-text" type="text" placeholder="Одна строка">
      <button class="btn btn--primary" type="submit">Сохранить</button>
      <p class="muted" id="plus-note" role="status"></p>
    </form>
  </dialog>

  <noscript>Для работы приложения нужен JavaScript.</noscript>
