<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Цветок настроения: варианты E, F и исходные</title>
<style>

h1{font-size:20px;margin:0 0 4px}p{margin:0 0 16px;color:#aaa}

.card:first-child{box-shadow:0 0 0 2px #ffffff55}.card{border-radius:28px;padding:16px 16px 18px;text-align:center;background:var(--bg,#2a2a30);transition:background .3s}
.card h2{font-size:15px;margin:0 0 2px}.card small{color:#ffffffa0;display:block;margin-bottom:6px}

</style></head><body>
<h1>Цветок настроения: объединения E (A+B+D) и F (A+B+C)</h1>
<p>Двигай общий ползунок: форма и цвет перетекают. Внизу каждой карточки семь уровней от −3 до +3.</p>
<input id="rng" type="range" min="-3" max="3" step="0.01" value="0">
<div class="grid" id="grid" style="margin-top:16px"></div>
<script>
const NS='http://www.w3.org/2000/svg',N=120;
const SH=[{n:8,a:.38,p:2.9},{n:8,a:.22,p:1.3},{n:8,a:.1,p:1},{n:1,a:0,p:1},{n:5,a:.08,p:1},{n:5,a:.2,p:1.7},{n:5,a:.3,p:.9}];
const COL=[[268,78,64],[236,84,68],[212,88,70],[194,70,74],[130,60,62],[58,88,62],[24,94,66]];
const NAMES=['Очень неприятно','Неприятно','Слегка неприятно','Нейтрально','Слегка приятно','Приятно','Очень приятно'];
const BG=[[268,28,22],[236,28,22],[212,26,22],[194,22,22],[130,22,20],[58,26,20],[24,30,22]];
const R=SH.map(s=>{const raw=[];let sum=0;for(let i=0;i<N;i++){const t=i/N*6.2832,w=((1+Math.cos(s.n*t))/2)**s.p;raw.push(w);sum+=w}const m=sum/N,r=raw.map(w=>1+s.a*(w-m)),mx=Math.max(...r);return r.map(x=>x/mx)});
const lerp=(a,b,t)=>a+(b-a)*t,cl=v=>Math.max(-3,Math.min(3,v));
function idx(v){const x=cl(v)+3,i=Math.min(5,Math.floor(x));return[i,x-i]}
function col(v,T=COL){const[i,t]=idx(v);return[0,1,2].map(k=>lerp(T[i][k],T[i+1][k],t))}
const hsl=(c,a=1,dl=0)=>`hsl(${c[0].toFixed(1)} ${c[1].toFixed(1)}% ${Math.min(97,c[2]+dl).toFixed(1)}% / ${a})`;
function path(v,s,round=1,rot=0){const[i,t]=idx(v),A=R[i],B=R[i+1];let d='';for(let k=0;k<N;k++){let r=lerp(A[k],B[k],t);r=1+(r-1)*round;const th=k/N*6.2832+rot;d+=(k?'L':'M')+(Math.cos(th)*r*s).toFixed(2)+' '+(Math.sin(th)*r*s).toFixed(2)}return d+'Z'}
function rad(v,k){const[i,t]=idx(v);return lerp(R[i][k%N],R[i+1][k%N],t)}
const E=(n,at={})=>{const e=document.createElementNS(NS,n);for(const k in at)e.setAttribute(k,at[k]);return e};
let U=0;
// ---------- A: стеклянные слои, свет складывается ----------
function A(){const id='A'+U++;const svg=E('svg',{viewBox:'-110 -110 220 220'});
svg.innerHTML=`<defs><radialGradient id="${id}g"><stop class="s0" offset=".3"/><stop class="s1" offset="1"/></radialGradient><filter id="${id}b"><feGaussianBlur stdDeviation="9"/></filter></defs>`;
const glow=E('path',{filter:`url(#${id}b)`});const L=[0,1,2,3].map(()=>({g:E('g'),p:E('path'),e:E('path',{fill:'none'})}));
svg.append(glow);L.forEach(o=>{o.g.append(o.p,o.e);svg.append(o.g)});
return{el:svg,draw(v,tm){const c=col(v);glow.setAttribute('d',path(v,72,.8));glow.setAttribute('fill',hsl(c,.28,-10));
const sc=[98,82,66,50],ro=[.9,.8,.7,.6];
L.forEach((o,i)=>{o.p.setAttribute('d',path(v,sc[i],ro[i]));
o.p.setAttribute('fill',hsl(c,.10+i*.06,-14+i*2));o.p.setAttribute('stroke','none');
o.e.setAttribute('d',path(v,sc[i],ro[i]));o.e.setAttribute('stroke',hsl(c,.85,18));o.e.setAttribute('stroke-width',1.1);
o.g.setAttribute('transform',`rotate(${(tm/1000*(i%2?-5:4)+i*19).toFixed(2)})`)})}}}
// ---------- B: тонкие контуры, как свёрнутые линии ----------
function B(){const svg=E('svg',{viewBox:'-110 -110 220 220'});const id='B'+U++;
svg.innerHTML=`<defs><radialGradient id="${id}"><stop class="s0" offset="0"/><stop class="s1" offset="1"/></radialGradient></defs>`;
const dot=E('circle',{r:26,fill:`url(#${id})`});svg.append(dot);const P=[];for(let i=0;i<9;i++){const p=E('path',{fill:'none','stroke-linejoin':'round'});svg.append(p);P.push(p)}
return{el:svg,draw(v,tm){const c=col(v);const s0=svg.querySelector('.s0'),s1=svg.querySelector('.s1');
s0.setAttribute('stop-color',hsl(c,.95,18));s1.setAttribute('stop-color',hsl(c,0,0));
P.forEach((p,i)=>{const k=i/8,sc=100-k*78;p.setAttribute('d',path(v,sc,1-k*.5,(tm/4000)*(i%2?-1:1)*(.4+k)+i*.14));
p.setAttribute('stroke',hsl(c,.6+k*.4,6+k*14));p.setAttribute('stroke-width',(.9+k*.9).toFixed(2))})}}}
// ---------- C: кристалл с гранями ----------
function C(){const svg=E('svg',{viewBox:'-110 -110 220 220'});const F=[];const K=48;
const ring=E('path',{fill:'none'}),ring2=E('path',{fill:'none'});svg.append(ring,ring2);
const core=E('g');for(let k=0;k<K;k++){const f=E('path');core.append(f);F.push(f)}
const hi=E('path',{fill:'none'});svg.append(core,hi);
return{el:svg,draw(v,tm){const c=col(v);ring.setAttribute('d',path(v,100,1));ring.setAttribute('stroke',hsl(c,.55,18));ring.setAttribute('stroke-width',.8);
ring2.setAttribute('d',path(v,88,.9));ring2.setAttribute('stroke',hsl(c,.3,22));ring2.setAttribute('stroke-width',.6);
const rt=tm/9000;for(let k=0;k<K;k++){const i0=Math.round(k*N/K),i1=Math.round((k+1)*N/K),t0=i0/N*6.2832,t1=i1/N*6.2832,r0=rad(v,i0)*72,r1=rad(v,i1)*72,mid=(t0+t1)/2+rt;
const lit=Math.cos(mid+2.2),rm=(r0+r1)/2/72,l=c[2]-34+lit*24+(rm-.85)*90;
F[k].setAttribute('d',`M0 0L${Math.cos(t0)*r0} ${Math.sin(t0)*r0}L${Math.cos(t1)*r1} ${Math.sin(t1)*r1}Z`);
const cc=`hsl(${c[0]} ${Math.min(100,c[1]+14)}% ${Math.max(10,Math.min(80,l))}%)`;F[k].setAttribute('fill',cc);F[k].setAttribute('stroke',cc);F[k].setAttribute('stroke-width',.3)}
core.setAttribute('transform',`rotate(${(rt*57.3).toFixed(1)})`);hi.setAttribute('d',path(v,72,1,0));hi.setAttribute('stroke',hsl(c,.9,30));hi.setAttribute('stroke-width',1);hi.setAttribute('transform',core.getAttribute('transform'))}}}
// ---------- D: жидкое стекло, мягкие пятна ----------
function D(){const id='D'+U++;const svg=E('svg',{viewBox:'-110 -110 220 220'});
svg.innerHTML=`<defs><filter id="${id}" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.2"/></filter><radialGradient id="${id}g" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset=".4" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>`;
const L=[0,1,2].map(()=>({g:E('g'),p:E('path',{filter:`url(#${id})`}),e:E('path',{fill:'none'})}));
L.forEach(o=>{o.g.append(o.p,o.e);svg.append(o.g)});const hl=E('path',{fill:`url(#${id}g)`,style:'mix-blend-mode:overlay'});svg.append(hl);
return{el:svg,draw(v,tm){const c=col(v);const sc=[96,70,46];L.forEach((o,i)=>{o.p.setAttribute('d',path(v,sc[i],.85-i*.1));o.p.setAttribute('fill',hsl(c,.3+i*.22,-18+i*8));
o.e.setAttribute('d',path(v,sc[i],.85-i*.1));o.e.setAttribute('stroke',hsl(c,.7,26));o.e.setAttribute('stroke-width',.8);o.e.setAttribute('stroke-opacity',.7);
o.g.setAttribute('transform',`rotate(${(tm/1000*(i%2?-5:5)+i*21).toFixed(1)}) scale(${1+Math.sin(tm/1600+i)*.025})`)});
hl.setAttribute('d',path(v,56,.9));}}}

// ---------- E: стеклянные слои снаружи, тонкие контуры внутри, жидкая линза в центре ----------
const shift=(c,dh,dl=0,ds=0)=>[(c[0]+dh+360)%360,Math.max(0,Math.min(100,c[1]+ds)),c[2]+dl];
function EE(){const id='E'+U++;const svg=E('svg',{viewBox:'-112 -112 224 224'});
const LAY=3;
let defs=`<filter id="${id}w" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="${id}r" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4.5"/></filter>
<filter id="${id}t" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1"/></filter>
<filter id="${id}d" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".3"/></filter>
<linearGradient id="${id}e" gradientUnits="userSpaceOnUse" x1="-80" y1="-90" x2="80" y2="90"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop class="e1" offset=".5"/><stop class="e2" offset="1"/></linearGradient>
<linearGradient id="${id}i" gradientUnits="userSpaceOnUse" x1="-90" y1="-90" x2="90" y2="90"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop class="i1" offset=".55"/><stop class="i2" offset="1"/></linearGradient>
<radialGradient id="${id}c" cx=".5" cy=".5" r=".5"><stop class="c0" offset="0"/><stop class="c1" offset=".62"/><stop class="c2" offset="1"/></radialGradient>
<radialGradient id="${id}h" cx=".34" cy=".28" r=".55"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".5" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="${id}m" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity=".55"/></linearGradient>`;
for(let i=0;i<LAY;i++) defs+=`<linearGradient id="${id}f${i}" gradientUnits="userSpaceOnUse" x1="-60" y1="-80" x2="70" y2="90"><stop class="f${i}a" offset="0"/><stop class="f${i}b" offset="1"/></linearGradient><clipPath id="${id}k${i}"><path class="kp${i}"/></clipPath>`;
svg.innerHTML=`<defs>${defs}</defs>`;
const q=c=>svg.querySelector(c);
const halo=E('path',{filter:`url(#${id}w)`});svg.append(halo);
const L=[];for(let i=0;i<LAY;i++){const g=E('g',{filter:`url(#${id}d)`});const fill=E('path',{fill:`url(#${id}f${i})`});
const inner=E('g',{'clip-path':`url(#${id}k${i})`});const glow=E('path',{fill:'none',filter:`url(#${id}r)`,stroke:`url(#${id}i)`});const thick=E('path',{fill:'none',filter:`url(#${id}t)`});inner.append(glow,thick);
const edge=E('path',{fill:'none','stroke-linejoin':'round',stroke:`url(#${id}e)`});const edge2=E('path',{fill:'none','stroke-linejoin':'round'});
g.append(fill,inner,edge2,edge);svg.append(g);L.push({g,fill,glow,thick,edge,edge2,kp:q('.kp'+i)})}
const lg=E('g');const lines=[];for(let i=0;i<8;i++){const p=E('path',{fill:'none','stroke-linejoin':'round'});lg.append(p);lines.push(p)}svg.append(lg);
// жидкая линза в центре
const drop=E('circle',{r:19,fill:`url(#${id}c)`});const rimL=E('circle',{r:18.5,fill:'none'});const spot=E('ellipse',{rx:7,ry:4,cx:-6,cy:-8,fill:`url(#${id}h)`,transform:'rotate(-30 -6 -8)'});
const caus=E('path',{fill:'none','stroke-linecap':'round'});const dot=E('circle',{r:1.4});
svg.append(drop,rimL,spot,caus,dot);
return{el:svg,draw(v,tm){const c=col(v),br=1+Math.sin(tm/1700)*.02;
const cols=[shift(c,-12,2),c,shift(c,12,-2)];
halo.setAttribute('d',path(v,82,.8));halo.setAttribute('fill',hsl(c,.35,-14));
q('.e1').setAttribute('stop-color',hsl(c,.55,20));q('.e2').setAttribute('stop-color',hsl(shift(c,16,-6),.85,4));
q('.i1').setAttribute('stop-color',hsl(c,.22,20));q('.i2').setAttribute('stop-color',hsl(c,.5,10));
const sc=[100,79,58],ro=[.92,.84,.74];
L.forEach((o,i)=>{const d=path(v,sc[i],ro[i]),cc=cols[i];
q('.f'+i+'a').setAttribute('stop-color',hsl(cc,.16-i*.02,14));q('.f'+i+'b').setAttribute('stop-color',hsl(cc,.05,0));
o.fill.setAttribute('d',d);o.kp.setAttribute('d',d);
o.glow.setAttribute('d',d);o.glow.setAttribute('stroke-width',(11-i*2));o.glow.setAttribute('stroke-opacity',.5);
o.thick.setAttribute('d',d);o.thick.setAttribute('stroke',hsl(cc,.6,26));o.thick.setAttribute('stroke-width',2.6);o.thick.setAttribute('stroke-opacity',.6);
o.edge.setAttribute('d',d);o.edge.setAttribute('stroke-width',(1.2-i*.15).toFixed(2));
o.edge2.setAttribute('d',path(v,sc[i]*.94,ro[i]));o.edge2.setAttribute('stroke',hsl(cc,.4,34));o.edge2.setAttribute('stroke-width',.5);
o.g.setAttribute('transform',`rotate(${(tm/1000*(i%2?-4:3.2)+i*21).toFixed(1)}) scale(${(1+(br-1)*(i+1)*.7).toFixed(4)})`)});
lines.forEach((p,i)=>{const k=i/7,s0=70-k*46;p.setAttribute('d',path(v,s0,.94-k*.3,(tm/4200)*(i%2?-1:1)*(.5+k)+i*.19));
p.setAttribute('stroke',hsl(shift(c,(k-.5)*18),.45+k*.4,22+k*12));p.setAttribute('stroke-width',(.5+k*.35).toFixed(2))});
lg.setAttribute('transform',`scale(${br.toFixed(4)})`);
q('.c0').setAttribute('stop-color',hsl(c,.9,34));q('.c1').setAttribute('stop-color',hsl(c,.6,14));q('.c2').setAttribute('stop-color',hsl(c,.95,2));
rimL.setAttribute('stroke',hsl(c,.75,30));rimL.setAttribute('stroke-width',.9);
caus.setAttribute('d','M-9 11Q0 17 10 10');caus.setAttribute('stroke',hsl(c,.55,34));caus.setAttribute('stroke-width',1.6);
dot.setAttribute('fill','rgba(255,255,255,.9)')}}}

// ---------- F: A (стеклянные слои) + B (тонкие контуры) + C (кристалл в центре) ----------
function FF(){const id='F'+U++;const svg=E('svg',{viewBox:'-112 -112 224 224'});const LAY=3,K=40;
let defs=`<filter id="${id}w" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="${id}r" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4.5"/></filter>
<filter id="${id}t" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1"/></filter>
<filter id="${id}d" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".3"/></filter>
<linearGradient id="${id}e" gradientUnits="userSpaceOnUse" x1="-80" y1="-90" x2="80" y2="90"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop class="e1" offset=".5"/><stop class="e2" offset="1"/></linearGradient>
<linearGradient id="${id}i" gradientUnits="userSpaceOnUse" x1="-90" y1="-90" x2="90" y2="90"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop class="i1" offset=".55"/><stop class="i2" offset="1"/></linearGradient>
<radialGradient id="${id}s" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".42"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></radialGradient>`;
for(let i=0;i<LAY;i++) defs+=`<linearGradient id="${id}f${i}" gradientUnits="userSpaceOnUse" x1="-60" y1="-80" x2="70" y2="90"><stop class="f${i}a" offset="0"/><stop class="f${i}b" offset="1"/></linearGradient><clipPath id="${id}k${i}"><path class="kp${i}"/></clipPath>`;
svg.innerHTML=`<defs>${defs}</defs>`;const q=c=>svg.querySelector(c);
const halo=E('path',{filter:`url(#${id}w)`});svg.append(halo);
const L=[];for(let i=0;i<LAY;i++){const g=E('g',{filter:`url(#${id}d)`});const fill=E('path',{fill:`url(#${id}f${i})`});
const inner=E('g',{'clip-path':`url(#${id}k${i})`});const glow=E('path',{fill:'none',filter:`url(#${id}r)`,stroke:`url(#${id}i)`});const thick=E('path',{fill:'none',filter:`url(#${id}t)`});inner.append(glow,thick);
const edge=E('path',{fill:'none','stroke-linejoin':'round',stroke:`url(#${id}e)`});const edge2=E('path',{fill:'none','stroke-linejoin':'round'});
g.append(fill,inner,edge2,edge);svg.append(g);L.push({g,fill,glow,thick,edge,edge2,kp:q('.kp'+i)})}
const lg=E('g');const lines=[];for(let i=0;i<7;i++){const p=E('path',{fill:'none','stroke-linejoin':'round'});lg.append(p);lines.push(p)}svg.append(lg);
const core=E('g');const F=[];for(let k=0;k<K;k++){const f=E('path');core.append(f);F.push(f)}
const shade=E('path',{fill:`url(#${id}s)`}),rim=E('path',{fill:'none','stroke-linejoin':'round'}),dot=E('circle',{r:1.4});core.append(shade,rim);svg.append(core,dot);
return{el:svg,draw(v,tm){const c=col(v),br=1+Math.sin(tm/1700)*.02;const cols=[shift(c,-12,2),c,shift(c,12,-2)];
halo.setAttribute('d',path(v,82,.8));halo.setAttribute('fill',hsl(c,.35,-14));
q('.e1').setAttribute('stop-color',hsl(c,.55,20));q('.e2').setAttribute('stop-color',hsl(shift(c,16,-6),.85,4));
q('.i1').setAttribute('stop-color',hsl(c,.22,20));q('.i2').setAttribute('stop-color',hsl(c,.5,10));
const sc=[100,79,58],ro=[.92,.84,.74];
L.forEach((o,i)=>{const d=path(v,sc[i],ro[i]),cc=cols[i];
q('.f'+i+'a').setAttribute('stop-color',hsl(cc,.16-i*.02,14));q('.f'+i+'b').setAttribute('stop-color',hsl(cc,.05,0));
o.fill.setAttribute('d',d);o.kp.setAttribute('d',d);o.glow.setAttribute('d',d);o.glow.setAttribute('stroke-width',(11-i*2));o.glow.setAttribute('stroke-opacity',.5);
o.thick.setAttribute('d',d);o.thick.setAttribute('stroke',hsl(cc,.6,26));o.thick.setAttribute('stroke-width',2.6);o.thick.setAttribute('stroke-opacity',.6);
o.edge.setAttribute('d',d);o.edge.setAttribute('stroke-width',(1.2-i*.15).toFixed(2));
o.edge2.setAttribute('d',path(v,sc[i]*.94,ro[i]));o.edge2.setAttribute('stroke',hsl(cc,.4,34));o.edge2.setAttribute('stroke-width',.5);
o.g.setAttribute('transform',`rotate(${(tm/1000*(i%2?-4:3.2)+i*21).toFixed(1)}) scale(${(1+(br-1)*(i+1)*.7).toFixed(4)})`)});
lines.forEach((p,i)=>{const k=i/6,s0=72-k*34;p.setAttribute('d',path(v,s0,.94-k*.3,(tm/4200)*(i%2?-1:1)*(.5+k)+i*.19));
p.setAttribute('stroke',hsl(shift(c,(k-.5)*18),.45+k*.4,22+k*12));p.setAttribute('stroke-width',(.5+k*.35).toFixed(2))});
lg.setAttribute('transform',`scale(${br.toFixed(4)})`);
// кристалл
const R=34,rt=tm/9000;for(let k=0;k<K;k++){const i0=Math.round(k*N/K),i1=Math.round((k+1)*N/K),t0=i0/N*6.2832,t1=i1/N*6.2832,r0=rad(v,i0)*R,r1=rad(v,i1)*R,mid=(t0+t1)/2+rt;
const lit=Math.cos(mid+2.2),rm=(r0+r1)/2/R,l=c[2]-26+lit*20+(rm-.85)*80;
F[k].setAttribute('d',`M0 0L${Math.cos(t0)*r0} ${Math.sin(t0)*r0}L${Math.cos(t1)*r1} ${Math.sin(t1)*r1}Z`);
const cc=`hsl(${c[0]} ${Math.min(100,c[1]-6)}% ${Math.max(12,Math.min(80,l))}%)`;F[k].setAttribute('fill',cc);F[k].setAttribute('stroke',cc);F[k].setAttribute('stroke-width',.3)}
const rd=path(v,R,1,0);shade.setAttribute('d',rd);rim.setAttribute('d',rd);rim.setAttribute('stroke',hsl(c,.9,32));rim.setAttribute('stroke-width',1);
