# Настройки облачной функции. Секретов здесь нет: токены задаются командой `npx wrangler secret put ИМЯ`.
name = "hub-bot"
main = "worker.js"
compatibility_date = "2026-01-01"

# Пульс проектов: раз в 5 минут (на бесплатном тарифе Cloudflare расписаний до 5 на аккаунт).
[triggers]
crons = ["*/5 * * * *"]

[vars]
# Заменить на свой логин GitHub: ЛОГИН/hub-data
DATA_REPO = "ЗАМЕНИ-НА-ЛОГИН/hub-data"
# Часовой пояс в минутах от UTC: Москва 180, Екатеринбург 300, Новосибирск 420. Уточни свой.
TZ_OFFSET_MIN = "180"
